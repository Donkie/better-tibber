name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" requires being listed in home-assistant/brands; not
          # applicable to a custom repository.
          ignore: brands

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "."

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component >=0.13.317 requires Python >=3.14
          # (it tracks whatever homeassistant-core currently needs); on 3.12 pip
          # falls back to 0.13.205, which predates the pytest-asyncio thread-cleanup
          # exclusion for aiodns' shutdown thread and spuriously fails
          # TestLogin::test_success_stores_and_returns_token.
          python-version: "3.14"
      - name: Install dependencies
        # Pinned for reproducibility (unpinned installs whatever release is newest
        # at run time). aioresponses 0.7.9 still doesn't support aiohttp>=3.14's
        # required ClientResponse `stream_writer` kwarg (the fix is stuck in an
        # unmerged upstream PR: https://github.com/pnuckowski/aioresponses/pull/288)
        # — tests/conftest.py shims it in rather than depending on an unreleased fork.
        run: pip install pytest-homeassistant-custom-component==0.13.355 aioresponses==0.7.9
      - name: Run tests
        run: python -m pytest tests/ -q
