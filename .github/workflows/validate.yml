name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" requires being listed in home-assistant/brands; not
          # applicable to a custom repository.
          ignore: brands

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "."

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pinned: unpinned installs pulled whatever pytest-homeassistant-custom-component
        # release was newest at run time, and older ones lack the pytest-asyncio
        # thread-cleanup exclusion for aiodns' shutdown thread, spuriously failing
        # TestLogin::test_success_stores_and_returns_token in CI (not reproducible
        # locally where a newer version happened to be installed).
        run: pip install pytest-homeassistant-custom-component==0.13.355 aioresponses==0.7.8
      - name: Run tests
        run: python -m pytest tests/ -q
